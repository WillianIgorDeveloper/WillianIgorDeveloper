<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#f0f0f2" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="0.3" cy="0" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="mask"><rect width="1200" height="420" fill="url(#fade)"/></mask>
  </defs>
  <style>
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: "Noto Sans", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1200" height="420" fill="#ffffff"/>
  <rect width="1200" height="420" fill="url(#grid)" mask="url(#mask)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" stroke="#e4e4e7"/>

  <!-- Location -->
  <rect x="64.5" y="64.5" width="186" height="31" fill="#ffffff" stroke="#e4e4e7"/>
  <g transform="translate(76 72) scale(0.66)" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/>
    <circle cx="12" cy="10" r="3"/>
  </g>
  <text x="100" y="85" class="mono" font-size="13" fill="#71717a">Sergipe, Brazil</text>

  <!-- Name -->
  <text x="64" y="150" class="mono" font-size="15" fill="#71717a">Hi, I'm</text>
  <text x="60" y="226" class="mono" font-size="76" font-weight="700" letter-spacing="-3" fill="#09090b">Willian Igor<tspan fill="#2563eb">_<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  <text x="64" y="274" class="mono" font-size="21" fill="#2563eb">Full-stack developer</text>

  <!-- Tagline -->
  <text x="64" y="330" class="sans" font-size="18" fill="#71717a">I build web, mobile and back-end products with a focus on</text>
  <text x="64" y="358" class="sans" font-size="18" fill="#71717a">scalability, simplicity and speed.</text>
</svg>
